apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-ai-tool
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Chi3aEv/practice-repo-.git   # replace with your repo URL
    targetRevision: ci-branch
    path: helm/devops-ai-tool
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: backend.secret.openaiApiKey
          value: ""   # override via kubectl or ArgoCD UI
  destination:
    server: https://kubernetes.default.svc
    namespace: devops-ai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
