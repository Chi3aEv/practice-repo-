name: DevOps AI Tool - CI Pipeline

on:
  push:
    branches:
      - ci-branch
  pull_request:
    branches:
      - ci-branch

jobs:
  backend-testing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devops-ai-tool/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: devops-ai-tool/backend/package.json

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test -- --watchAll=false 
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  build-backend:
    runs-on: ubuntu-latest
    needs: backend-testing
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t devops-ai-backend:${{ github.sha }} ./devops-ai-tool/backend

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devops-ai-tool/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: devops-ai-tool/frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test -- --watchAll=false --coverage
        env:
          CI: false

  build-frontend:
    runs-on: ubuntu-latest
    needs: test-frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: devops-ai-tool/frontend/package.json

      - name: Install dependencies
        run: npm install
        working-directory: devops-ai-tool/frontend

      - name: Build frontend
        run: npm run build
        working-directory: devops-ai-tool/frontend

      - name: Build frontend Docker image
        run: docker build -t devops-ai-frontend:${{ github.sha }} ./devops-ai-tool/frontend
