apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: devops-ai-tool
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-ai-tool
      tier: backend
  template:
    metadata:
      labels:
        app: devops-ai-tool
        tier: backend
    spec:
      containers:
        - name: backend
          image: devops-ai-backend:latest
          ports:
            - containerPort: 5000
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: devops-ai-secrets
                  key: OPENAI_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: devops-ai-tool
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-ai-tool
      tier: frontend
  template:
    metadata:
      labels:
        app: devops-ai-tool
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: devops-ai-frontend:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
